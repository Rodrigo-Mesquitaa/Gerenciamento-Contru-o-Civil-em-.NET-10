version: "3.8"
services:
  rabbitmq:
    image: "rabbitmq:3-management"
    container_name: "cc-rabbitmq"
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER to a non-guest account}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS to a strong local secret}"

  mssql:
    image: "mcr.microsoft.com/mssql/server:2019-latest"
    container_name: "cc-sqlserver"
    environment:
      SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD to a strong local secret}"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q \"select 1\""]
      interval: 10s
      timeout: 10s
      retries: 10
