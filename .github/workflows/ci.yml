name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CivilConstruction.sln

      - name: Build
        run: dotnet build CivilConstruction.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CivilConstruction.Tests/CivilConstruction.Tests.csproj --configuration Release --no-build

      - name: Publish API
        run: dotnet publish CivilConstruction.API/CivilConstruction.API.csproj --configuration Release --no-build --output artifacts/api

      - name: Publish Worker
        run: dotnet publish CivilConstruction.Worker/CivilConstruction.Worker.csproj --configuration Release --no-build --output artifacts/worker

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: civil-construction-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
